name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The official action installs the project's pinned Vite+ and dependencies.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # Fixture apps own their generated TypeScript configs and are checked below.
      - name: Check formatting
        run: vp fmt . --check
      - name: Check library and test tooling
        run: vp lint src tests scripts vite.config.ts
      - name: Run library tests
        run: vp run test
      # file: dependencies in the fixtures consume the built library.
      - name: Build library
        run: vp run build
      - name: Install Kit 2 fixture dependencies
        working-directory: fixtures/kit2
        run: vp install --frozen-lockfile
      - name: Install Kit 3 fixture dependencies
        working-directory: fixtures/kit3
        run: vp install --frozen-lockfile
      - name: Check fixture types, production SSR, and remote HTTP
        run: vp run test:fixtures
